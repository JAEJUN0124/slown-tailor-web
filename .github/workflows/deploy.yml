name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# One Pages site, two apps: landing/ at the site root, brand-shop/ under /shop/.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            landing/package-lock.json
            brand-shop/package-lock.json

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build landing
        working-directory: landing
        run: |
          npm ci
          npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Build brand shop
        working-directory: brand-shop
        run: |
          npm ci
          npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/shop

      - name: Combine both sites
        run: |
          mkdir -p site/shop
          cp -R landing/out/. site/
          cp -R brand-shop/out/. site/shop/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
